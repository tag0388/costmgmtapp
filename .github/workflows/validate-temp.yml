name: Temporary branch validation

on:
  push:
    branches:
      - standard-table-bulk-excel-20260911

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
